[package]
name = "agent-review-helper"
version = "0.1.0"
edition = "2021"
description = "Prepare a self-contained folder of PR review artifacts for an LLM, using jj + gh."
authors = ["Connor Fitzgerald <connorwadefitzgerald@gmail.com>"]
repository = "https://github.com/cwfitzgerald/agent-review-helper"
license = "MIT OR Apache-2.0 OR Zlib"
readme = "README.md"

[[bin]]
name = "agent-review-helper"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
